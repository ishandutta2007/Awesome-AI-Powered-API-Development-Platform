<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.65; }
    }
    @keyframes pulsePurple {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.22) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    .orb-cyan { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 220px 180px; }
    .orb-purple { animation: pulsePurple 10s ease-in-out infinite; transform-origin: 980px 220px; }
    .circuit-line { stroke-dasharray: 8 12; animation: dashMove 4s linear infinite; }
    .circuit-line-fast { stroke-dasharray: 6 10; animation: dashMove 2.5s linear infinite; }
    .floating-1 { animation: floatPill 5s ease-in-out infinite; }
    .floating-2 { animation: floatPillReverse 6s ease-in-out infinite; }
    .floating-3 { animation: floatPill 5.5s ease-in-out infinite; }
    .floating-4 { animation: floatPillReverse 6.5s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)"/>

  <!-- Border Highlight -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <circle cx="200" cy="160" r="140" fill="url(#accentCyan)" filter="url(#glow)" class="orb-cyan"/>
  <circle cx="1000" cy="240" r="160" fill="url(#accentPurple)" filter="url(#glow)" class="orb-purple"/>

  <!-- Animated Circuit & Data Lines -->
  <g opacity="0.45">
    <path d="M 60 100 L 280 100 L 340 160 L 500 160" fill="none" stroke="#00f2fe" stroke-width="2" class="circuit-line"/>
    <circle cx="60" cy="100" r="4" fill="#38bdf8"/>
    <circle cx="500" cy="160" r="4" fill="#38bdf8"/>

    <path d="M 700 280 L 860 280 L 920 220 L 1140 220" fill="none" stroke="#c084fc" stroke-width="2" class="circuit-line-fast"/>
    <circle cx="700" cy="280" r="4" fill="#c084fc"/>
    <circle cx="1140" cy="220" r="4" fill="#c084fc"/>

    <path d="M 120 340 L 300 340 L 360 280 L 460 280" fill="none" stroke="#38bdf8" stroke-width="1.5" class="circuit-line"/>
    <path d="M 740 140 L 840 140 L 900 80 L 1080 80" fill="none" stroke="#818cf8" stroke-width="1.5" class="circuit-line"/>
  </g>

  <!-- Animated Feature Badges / Floating Elements (Framing the text) -->
  <g class="floating-1" transform="translate(140, 60)">
    <rect width="130" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="65" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">⚡ MCP SERVERS</text>
  </g>

  <g class="floating-2" transform="translate(930, 60)">
    <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    <text x="70" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">🤖 AI AGENTS</text>
  </g>

  <g class="floating-3" transform="translate(130, 325)">
    <rect width="150" height="34" rx="17" fill="#0f172a" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
    <text x="75" y="22" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">🔒 LOCAL-FIRST / BYOK</text>
  </g>

  <g class="floating-4" transform="translate(920, 325)">
    <rect width="150" height="34" rx="17" fill="#0f172a" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6"/>
    <text x="75" y="22" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">🧪 AI TEST SYNTHESIS</text>
  </g>

  <!-- Central Foreground Content (Guaranteed Crisp Foreground Visibility) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 105)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="-110" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="8" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGradient)" filter="url(#subtleGlow)" letter-spacing="-0.5">
    AI-POWERED API PLATFORMS
  </text>

  <!-- Subtitle -->
  <text x="600" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#f1f5f9" letter-spacing="0.2">
    Next-Gen API Clients, MCP Debugging, Synthetic Testing &amp; Autonomous Agent Workflows
  </text>

  <!-- Tagline / Pills Row -->
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
    Full-Lifecycle SaaS Suites &amp; Production-Ready Open-Source Tools (Postman • Bruno • Insomnia • Yaak • Hoppscotch)
  </text>

  <!-- Bottom Accent Line -->
  <path d="M 450 288 L 750 288" stroke="url(#textGradient)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
